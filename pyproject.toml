[project]
name = "crm-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "black>=26.5.1",
    "django>=6.1.1",
    "django-cors-headers>=4.9.0",
    "django-filter>=26.1",
    "django-user-agents>=0.4.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-camel-case>=1.4.2",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-nested-forms>=1.1.8",
    "drf-spectacular>=0.30.0",
    "gunicorn>=26.2.0",
    "nepali-datetime>=1.0.8.5",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.13",
    "python-decouple>=3.8",
    "rest-framework-simplejwt>=0.0.2",
    "ruff>=0.16.9",
    "uvicorn>=0.54.0",
]


[tool.ruff]

line-length = 88
target-version = "py311"


[tool.ruff.lint]

# Enable pyflakes (F), pycodestyle (E), isort (I)
select = ["E", "F", "I"]
ignore = ["F401", "E501"]  # Ignore unused imports everywhere



[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.black]
max-line-length = 18 # Or your desired length
